<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram 맞팔 확인</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            transition: max-width 0.2s;
        }
        .container.expanded {
            max-width: 500px;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 24px;
            color: #262626;
        }
        .form-group {
            margin-bottom: 16px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #dbdbdb;
            border-radius: 6px;
            font-size: 14px;
            background: #fafafa;
        }
        input:focus {
            outline: none;
            border-color: #a8a8a8;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0095f6;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover {
            background: #1877f2;
        }
        button:disabled {
            background: #b2dffc;
            cursor: not-allowed;
        }
        button.logout-btn {
            background: #ed4956;
        }
        button.logout-btn:hover {
            background: #c13543;
        }
        .error {
            color: #ed4956;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
        }
        .success {
            text-align: center;
            color: #262626;
        }
        .success .username {
            font-size: 20px;
            font-weight: 600;
            margin: 16px 0;
        }
        .success .check {
            font-size: 48px;
            color: #0095f6;
            margin-bottom: 8px;
        }
        .hidden {
            display: none !important;
        }
        .info {
            font-size: 13px;
            color: #8e8e8e;
            text-align: center;
            margin-top: 12px;
        }
        #cooldown-info {
            color: #d35400;
        }
        button.fetch-btn {
            background: #00376b;
            margin-bottom: 8px;
        }
        button.fetch-btn:hover {
            background: #004a99;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .result-header {
            font-size: 15px;
            font-weight: 600;
            color: #262626;
            margin: 16px 0 8px;
            text-align: center;
        }
        .user-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #dbdbdb;
            border-radius: 6px;
            margin-top: 8px;
        }
        .user-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #efefef;
        }
        .user-item:last-child {
            border-bottom: none;
        }
        .user-item .user-info {
            overflow: hidden;
            flex: 1;
            min-width: 0;
        }
        .user-item .user-info .uname {
            font-size: 14px;
            font-weight: 600;
            color: #262626;
        }
        /* List view styles */
        .list-container {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
        }
        .back-btn {
            background: none;
            border: none;
            color: #0095f6;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            margin-bottom: 16px;
            width: auto;
        }
        .back-btn:hover {
            background: none;
            color: #1877f2;
        }
        .progress-area {
            text-align: center;
            padding: 24px 0;
        }
        .progress-area .spinner-lg {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #0095f6;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        .progress-text {
            font-size: 15px;
            color: #262626;
            font-weight: 500;
        }
        .list-view .user-list {
            max-height: none;
            overflow-y: visible;
        }
        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
        }
        .toolbar input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #dbdbdb;
            border-radius: 6px;
            font-size: 13px;
            background: #fafafa;
        }
        .toolbar button {
            width: auto;
            padding: 10px 14px;
            font-size: 12px;
            margin-top: 0;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .drop-zone { border: 1px dashed #a8a8a8; border-radius: 6px; padding: 16px; margin-top: 16px; text-align: center; }
        .drop-zone.dragging { border-color: #0095f6; background: #f0f8ff; }
        .drop-zone input { max-width: 100%; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Instagram 맞팔 확인</h1>

        <!-- Login State -->
        <div id="login-view" class="hidden">
            <div class="form-group">
                <input type="text" id="username" placeholder="사용자 이름" autocomplete="username">
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password">
            </div>
            <button id="login-btn" onclick="doLogin()">로그인</button>
            <div id="login-error" class="error hidden"></div>
            <button class="back-btn" onclick="showHome()">파일 비교로 돌아가기</button>
        </div>

        <!-- 2FA State -->
        <div id="twofa-view" class="hidden">
            <p class="info" style="margin-bottom: 16px;">Instagram 앱에서 로그인 요청을 승인해주세요.</p>
            <p class="info" style="margin-bottom: 16px; color: #262626;">앱에서 승인 완료 후 아래 버튼을 눌러주세요.</p>
            <button id="twofa-retry-btn" onclick="doRetryLogin()">승인 완료, 다시 시도</button>
            <hr style="margin: 20px 0; border: none; border-top: 1px solid #dbdbdb;">
            <p class="info" style="margin-bottom: 12px;">또는 인증 코드가 있다면 직접 입력:</p>
            <div class="form-group">
                <input type="text" id="twofa-code" placeholder="6자리 인증 코드 (선택)" maxlength="8" autocomplete="one-time-code">
            </div>
            <button id="twofa-btn" onclick="doVerify()" style="background: #8e8e8e;">코드로 인증</button>
            <div id="twofa-error" class="error hidden"></div>
        </div>

        <div id="loggedin-view">
            <div class="success">
                <div id="connection-check" class="check hidden">&#10003;</div>
                <p id="connection-status">로컬 파일 비교</p>
                <p class="username" id="display-username"></p>
            </div>
            <label for="data-source">비교할 자료</label>
            <select id="data-source" onchange="selectData(this.value)" style="width:100%;padding:10px;margin-top:8px"></select>
            <p id="snapshot-info" class="info">저장된 JSON을 확인합니다.</p>
            <details id="data-validation" class="info hidden" style="text-align:left"></details>
            <p id="export-info" class="info" aria-live="polite"></p>
            <div id="export-recovery" class="error hidden" role="alert"></div>
            <div id="fetch-error" class="error hidden" role="alert"></div>
            <button id="fetch-btn" class="fetch-btn" onclick="doFetch()">맞팔 안한 목록</button>
            <button id="connect-btn" onclick="showView(loginView)">자동 내보내기용 로그인</button>
            <button id="refresh-btn" onclick="doRefresh()">JSON 갱신</button>
            <div id="drop-zone" class="drop-zone">
                <label for="import-files">ZIP·JSON 가져오기</label>
                <details class="info"><summary>내보내기 생성 시각 입력 (선택)</summary>
                    <label for="exported-at">파일 생성 시각을 알고 있을 때만 입력하세요.</label>
                    <input id="exported-at" type="datetime-local">
                    <p>팔로우한 날짜나 파일을 받은 날짜가 아닙니다. 모르면 비워두세요.</p>
                </details>
                <input id="import-files" type="file" accept=".zip,.json" multiple onchange="doImport(this.files)">
                <p class="info">파일을 여기에 놓아도 됩니다. 한 번의 내보내기에 속한 파일을 모두 선택하세요.</p>
            </div>
            <button id="logout-btn" class="logout-btn" onclick="doLogout()">로그아웃</button>
            <details id="data-management" class="info" style="text-align:left">
                <summary>저장 자료 관리</summary>
                <button data-manage onclick="previewManagement('cleanup')">사용하지 않는 파일 정리 범위 확인</button>
                <button data-manage onclick="previewManagement('delete_data')">선택한 자료 삭제 범위 확인</button>
                <div id="management-preview" aria-live="polite"></div>
                <div id="management-confirm-row" class="hidden">
                    <label><input type="checkbox" id="management-confirm" onchange="updateManagementConfirm()">위 삭제 범위를 확인했습니다.</label>
                    <button id="management-execute" onclick="doManage()" disabled>확인한 범위 삭제</button>
                </div>
            </details>
            <details id="setup-check" class="info" style="text-align:left">
                <summary>설치 상태 확인</summary>
                <button id="setup-run" onclick="checkSetup()">계정 접속 없이 설치 점검</button>
                <div id="setup-result" aria-live="polite"></div>
            </details>
        </div>
        <div id="list-view" class="hidden list-view">
            <button class="back-btn" onclick="goBack()">&larr; 돌아가기</button>
            <div id="list-toolbar" class="toolbar hidden">
                <input type="text" id="search-input" placeholder="아이디 검색" oninput="filterList()">
            </div>
            <div id="list-progress" class="progress-area hidden">
                <div class="spinner-lg"></div>
                <p class="progress-text">저장된 JSON 비교 중...</p>
            </div>
            <div id="list-error" class="error hidden" role="alert"></div>
            <div id="list-result" class="hidden">
                <p class="result-header" id="list-result-count"></p>
                <p id="list-snapshot-info" class="info"></p>
                <details id="list-validation" class="info hidden" style="text-align:left"></details>
                <div class="user-list" id="list-user-list"></div>
                <p id="filtered-count" class="info" aria-live="polite"></p>
                <div id="result-actions" class="hidden">
                    <label for="result-scope">복사·저장 범위</label>
                    <select id="result-scope" onchange="updateResultActions()" style="width:100%;padding:8px">
                        <option value="filtered">검색 결과</option><option value="all">전체 결과</option>
                    </select>
                    <button id="copy-users" onclick="copyUsers()">아이디 복사</button>
                    <button id="save-txt" onclick="saveUsers('txt')">TXT 저장</button>
                    <button id="save-csv" onclick="saveUsers('csv')">CSV 저장</button>
                    <p id="result-message" class="info" role="status"></p>
                    <textarea id="copy-fallback" class="hidden" readonly aria-label="직접 복사할 아이디" style="width:100%;height:100px"></textarea>
                </div>
            </div>
        </div>
    </div>
    <script>
        const loginView = document.getElementById("login-view");
        const twofaView = document.getElementById("twofa-view");
        const loggedinView = document.getElementById("loggedin-view");
        const listView = document.getElementById("list-view");
        let operationPending = false;
        let isLoggedIn = false;
        let managementPlan = null;
        let setupChecking = false;
        let fetchedUsers = [];

        function showView(view) {
            [loginView, twofaView, loggedinView, listView].forEach(v => v.classList.toggle("hidden", v !== view));
            document.querySelector(".container").classList.toggle("expanded", view === listView);
        }
        function showError(id, message) {
            const el = document.getElementById(id);
            el.textContent = message || "처리하지 못했습니다.";
            el.classList.remove("hidden");
        }
        function hideError(id) { document.getElementById(id).classList.add("hidden"); }
        function showFailure(id, data) {
            showError(id, data.message);
            const element = document.getElementById(id);
            const actions = {
                import: ["파일 다시 가져오기", () => { showView(loggedinView); document.getElementById("import-files").click(); }],
                compare: ["저장된 자료 비교", doFetch],
                login: ["자동 내보내기 계정 연결", () => showView(loginView)],
                choose_source: ["다른 자료 선택", () => { showView(loggedinView); document.getElementById("data-source").focus(); }],
                check_export: ["JSON 준비 확인", doRefresh],
                retry_preparation: ["제출 전 준비 복구", () => doRecover("retry_preparation")],
                recover_record: ["작업 기록 보관·복구", () => doRecover("recover_record")],
                setup: ["설치 상태 확인", () => { showView(loggedinView); document.getElementById("setup-check").open = true; checkSetup(); }],
            };
            for (const action of Array.isArray(data.actions) ? data.actions : []) {
                if (!actions[action]) continue;
                const button = document.createElement("button");
                button.type = "button"; button.dataset.recoveryAction = action;
                button.textContent = actions[action][0]; button.disabled = operationPending;
                button.onclick = () => { if (!operationPending) actions[action][1](); };
                element.appendChild(button);
            }
        }
        async function doRecover(action) {
            if (operationPending) return;
            setPending(true);
            try {
                const data = await api("/api/export/recover", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({action})});
                if (data.status !== "ok") showFailure("fetch-error", data);
                else hideError("fetch-error");
                await updateStatus();
            } catch (_) { showError("fetch-error", "작업 기록을 복구하지 못했습니다. 기존 자료는 보존했습니다."); }
            finally { setPending(false); }
        }
        async function checkSetup() {
            if (setupChecking || operationPending) return;
            setupChecking = true;
            const button = document.getElementById("setup-run"); button.disabled = true;
            const root = document.getElementById("setup-result"); root.textContent = "설치 상태 확인 중...";
            try {
                const data = await api("/api/setup"); root.replaceChildren();
                const status = document.createElement("p");
                status.textContent = "로컬 파일 비교: " + (data.local_ready ? "준비됨" : "설치 확인 필요")
                    + " · 자동 내보내기 실행 환경: " + (data.auto_export_environment_ready ? "준비됨" : "추가 확인 필요") + " · 실제 계정 연동 미검증";
                root.appendChild(status);
                for (const message of data.messages || []) { const line = document.createElement("p"); line.textContent = message.text; root.appendChild(line); }
                const mismatches = (data.packages || []).filter(item => !item.ok);
                if (mismatches.length) {
                    const details = document.createElement("details"); const summary = document.createElement("summary");
                    summary.textContent = "설치 버전 확인이 필요한 패키지"; details.appendChild(summary);
                    for (const item of mismatches) { const line = document.createElement("p"); line.textContent = `${item.name}: ${item.installed || "미설치"} / 필요 ${item.expected}`; details.appendChild(line); }
                    root.appendChild(details);
                }
            } catch (_) { root.textContent = "설치 상태를 확인하지 못했습니다. 프로젝트 폴더에서 setup_check.py로 확인해주세요."; }
            finally { setupChecking = false; button.disabled = false; }
        }

        function savedText(data) {
            if (!data.saved_at && !data.imported_at) return "저장된 JSON이 없습니다.";
            const imported = data.imported_at ? "가져온 시각: " + new Date(data.imported_at * 1000).toLocaleString()
                : "기존 파일 저장 기록: " + new Date(data.saved_at * 1000).toLocaleString();
            const exported = data.exported_at ? new Date(data.exported_at * 1000).toLocaleString() + " (직접 입력)" : "미확인";
            const age = data.exported_at ? Math.max(0, Math.floor((Date.now() / 1000 - data.exported_at) / 86400)) : null;
            return imported + " · 내보내기 생성 시각: " + exported + (age > 0 ? ` · 생성 후 ${age}일 경과` : "") + " · 실시간 상태가 아닙니다.";
        }
        function renderValidation(id, data) {
            const element = document.getElementById(id);
            element.replaceChildren();
            element.classList.toggle("hidden", !data.validation);
            if (!data.validation) return;
            const summary = document.createElement("summary");
            summary.textContent = `파일 검사 · 팔로잉 ${data.following_count}명 / 팔로워 ${data.followers_count}명 (중복 제거)`;
            element.appendChild(summary);
            const note = document.createElement("p");
            note.textContent = "형식·분할 번호 검사 통과. 전체 자료 여부는 미확인입니다. " + data.validation.note;
            element.appendChild(note);
            const list = document.createElement("ul");
            for (const file of data.validation.files || []) {
                const item = document.createElement("li");
                item.textContent = `${file.name}: ${file.records}개 항목`;
                list.appendChild(item);
            }
            element.appendChild(list);
        }
        async function api(path, options) {
            const response = await fetch(path, options);
            if (!response.ok) throw new Error("request failed");
            return response.json();
        }
        async function updateStatus() {
            const data = await api("/api/status");
            const exp = data.export || {};
            if (exp.code) showFailure("export-recovery", exp); else hideError("export-recovery");
            isLoggedIn = Boolean(data.logged_in);
            const local = data.data || {source: "local", sources: [{id: "local", label: "가져온 파일"}], saved_at: exp.saved_at};
            const sources = document.getElementById("data-source");
            sources.replaceChildren();
            for (const source of local.sources || []) {
                const option = document.createElement("option");
                option.value = source.id; option.textContent = source.label; sources.appendChild(option);
            }
            sources.value = local.source || "";
            if (local.code) showFailure("fetch-error", local);
            document.getElementById("display-username").textContent = isLoggedIn && data.username ? "@" + data.username : "";
            document.getElementById("connection-status").textContent = isLoggedIn ? "계정 연결됨" : "로컬 파일 비교";
            document.getElementById("connection-check").classList.toggle("hidden", !isLoggedIn);
            document.getElementById("connect-btn").classList.toggle("hidden", isLoggedIn);
            document.getElementById("logout-btn").classList.toggle("hidden", !isLoggedIn);
            document.getElementById("refresh-btn").classList.toggle("hidden", !isLoggedIn);
            document.getElementById("snapshot-info").textContent = savedText(local);
            renderValidation("data-validation", local);
            const wait = exp.retry_after > 0 ? ` (다음 확인까지 약 ${Math.ceil(exp.retry_after / 60)}분)` : "";
            document.getElementById("export-info").textContent = (local.message || exp.message || "") + wait;
            const active = ["submitted", "pending", "uncertain", "downloading", "downloaded"].includes(exp.phase);
            document.getElementById("refresh-btn").textContent = active ? "JSON 준비 확인" : "JSON 갱신";
            return data;
        }
        function showHome() {
            showView(loggedinView);
            updateStatus().catch(() => showError("fetch-error", "저장 상태를 확인하지 못했습니다."));
        }
        function showLoggedIn(username) {
            isLoggedIn = true;
            document.getElementById("password").value = "";
            showHome();
        }
        async function selectData(source) {
            if (operationPending) return;
            setPending(true);
            clearManagement();
            try {
                const data = await api("/api/data/select", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({source})});
                if (data.status !== "ok") showFailure("fetch-error", data);
                fetchedUsers = []; document.getElementById("list-user-list").replaceChildren();
                await updateStatus();
            } catch (_) { showError("fetch-error", "자료를 선택하지 못했습니다."); }
            finally { setPending(false); }
        }
        function setPending(value) {
            operationPending = value;
            ["fetch-btn", "refresh-btn", "logout-btn"].forEach(id => document.getElementById(id).disabled = value);
            document.getElementById("import-files").disabled = value;
            document.getElementById("data-source").disabled = value;
            document.getElementById("connect-btn").disabled = value;
            document.getElementById("refresh-btn").disabled = value || !isLoggedIn;
            document.querySelectorAll("[data-recovery-action]").forEach(button => button.disabled = value);
            document.querySelectorAll("[data-manage]").forEach(button => button.disabled = value);
            document.getElementById("management-confirm").disabled = value;
            updateManagementConfirm();
            updateResultActions();
        }
        function clearManagement() {
            managementPlan = null;
            document.getElementById("management-preview").replaceChildren();
            document.getElementById("management-confirm").checked = false;
            document.getElementById("management-confirm-row").classList.add("hidden");
        }
        function updateManagementConfirm() {
            document.getElementById("management-execute").disabled = operationPending || !managementPlan || !managementPlan.files.length || !document.getElementById("management-confirm").checked;
        }
        async function previewManagement(mode) {
            if (operationPending) return;
            clearManagement(); setPending(true); hideError("fetch-error");
            try {
                const source = document.getElementById("data-source").value;
                const data = await api("/api/data/preview", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({source, mode})});
                if (data.status !== "ok") { showFailure("fetch-error", data); return; }
                managementPlan = data;
                const root = document.getElementById("management-preview");
                const summary = document.createElement("p");
                summary.textContent = `${data.message} 대상: ${data.files.length}개 / ${(data.total_bytes / 1024 / 1024).toFixed(2)}MB`;
                root.appendChild(summary);
                const list = document.createElement("ul");
                for (const file of data.files) { const item = document.createElement("li"); item.textContent = file.path; list.appendChild(item); }
                root.appendChild(list);
                const kept = document.createElement("p"); kept.textContent = "유지: " + data.preserved.join(", "); root.appendChild(kept);
                document.getElementById("management-confirm-row").classList.toggle("hidden", !data.files.length);
            } catch (_) { showError("fetch-error", "정리 범위를 확인하지 못했습니다. 파일을 삭제하지 않았습니다."); }
            finally { setPending(false); }
        }
        async function doManage() {
            if (operationPending || !managementPlan || !document.getElementById("management-confirm").checked) return;
            const plan = managementPlan; setPending(true);
            try {
                const data = await api("/api/data/manage", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({source:plan.source, mode:plan.mode, token:plan.token, confirmed:true})});
                clearManagement();
                if (data.status !== "ok") { showFailure("fetch-error", data); return; }
                fetchedUsers = []; document.getElementById("list-user-list").replaceChildren();
                await updateStatus(); document.getElementById("management-preview").textContent = data.message;
            } catch (_) { showError("fetch-error", "정리 결과를 확인하지 못했습니다. 범위를 다시 확인해주세요."); clearManagement(); }
            finally { setPending(false); }
        }
        async function doImport(files) {
            if (operationPending || !files.length) return;
            if (files.length > 100 || Array.from(files).reduce((n, f) => n + f.size, 0) > 100 * 1024 * 1024) {
                showError("fetch-error", "파일은 최대 100개, 합계 100MB까지 가져올 수 있습니다."); return;
            }
            clearManagement(); setPending(true);
            hideError("fetch-error");
            try {
                const body = new FormData();
                const date = document.getElementById("exported-at").value;
                if (date) body.append("exported_at", new Date(date).toISOString());
                for (const file of files) body.append("files", file);
                const response = await fetch("/api/import", {method: "POST", body});
                const data = await response.json();
                if (data.status !== "ok") { showFailure("fetch-error", data); return; }
                await updateStatus();
                document.getElementById("exported-at").value = "";
                document.getElementById("export-info").textContent = "파일을 가져왔습니다. 맞팔 안한 목록을 눌러 확인하세요.";
            } catch (_) { showError("fetch-error", "파일을 가져오지 못했습니다. 기존 자료는 유지됩니다."); }
            finally { setPending(false); document.getElementById("import-files").value = ""; }
        }
        async function doLogin() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            if (!username || !password) return;

            const btn = document.getElementById("login-btn");
            btn.disabled = true;
            btn.textContent = "로그인 중...";
            hideError("login-error");

            try {
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({username, password}),
                });
                const data = await res.json();

                if (data.status === "ok") {
                    showLoggedIn(username);
                } else if (data.status === "2fa_required") {
                    showView(twofaView);
                } else if (data.status === "challenge_required") {
                    showError("login-error", data.message);
                } else {
                    showError("login-error", data.message);
                }
            } catch (e) {
                showError("login-error", "네트워크 오류가 발생했습니다.");
            } finally {
                btn.disabled = false;
                btn.textContent = "로그인";
            }
        }

        async function doRetryLogin() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const btn = document.getElementById("twofa-retry-btn");
            btn.disabled = true;
            btn.textContent = "확인 중...";
            hideError("twofa-error");

            try {
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({username, password}),
                });
                const data = await res.json();

                if (data.status === "ok") {
                    showLoggedIn(username);
                } else if (data.status === "2fa_required") {
                    showError("twofa-error", "아직 승인되지 않았습니다. 앱에서 승인 후 다시 시도하세요.");
                } else {
                    showError("twofa-error", data.message || "로그인 실패");
                }
            } catch (e) {
                showError("twofa-error", "네트워크 오류가 발생했습니다.");
            } finally {
                btn.disabled = false;
                btn.textContent = "승인 완료, 다시 시도";
            }
        }

        async function doVerify() {
            const code = document.getElementById("twofa-code").value.trim();
            if (!code) return;

            const btn = document.getElementById("twofa-btn");
            btn.disabled = true;
            btn.textContent = "확인 중...";
            hideError("twofa-error");

            try {
                const res = await fetch("/api/verify", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({code}),
                });
                const data = await res.json();

                if (data.status === "ok") {
                    const username = document.getElementById("username").value.trim();
                    showLoggedIn(username);
                } else {
                    showError("twofa-error", data.message);
                }
            } catch (e) {
                showError("twofa-error", "네트워크 오류가 발생했습니다.");
            } finally {
                btn.disabled = false;
                btn.textContent = "확인";
            }
        }


        async function doLogout() {
            if (operationPending) return;
            setPending(true);
            try {
                const data = await api("/api/logout", {method: "POST"});
                if (data.status !== "ok") { showFailure("fetch-error", data); return; }
                fetchedUsers = [];
                document.getElementById("list-user-list").replaceChildren();
                document.getElementById("username").value = "";
                document.getElementById("password").value = "";
                isLoggedIn = false;
                showHome();
            } catch (_) { showError("fetch-error", "로그아웃하지 못했습니다."); }
            finally { setPending(false); }
        }
        function goBack() {
            if (!operationPending) showView(loggedinView);
        }
        function renderUserList(users) {
            const list = document.getElementById("list-user-list");
            list.replaceChildren();
            for (const user of users) {
                const row = document.createElement("div");
                row.className = "user-item";
                row.dataset.username = user.username;
                row.textContent = "@" + user.username;
                list.appendChild(row);
            }
            filterList();
        }
        function filteredUsers() {
            const query = document.getElementById("search-input").value.trim().toLowerCase().replace(/^@/, "");
            return fetchedUsers.filter(user => user.username.toLowerCase().includes(query));
        }
        function selectedUsers() {
            return document.getElementById("result-scope").value === "all" ? fetchedUsers : filteredUsers();
        }
        function updateResultActions() {
            const count = selectedUsers().length;
            ["copy-users", "save-txt", "save-csv"].forEach(id => document.getElementById(id).disabled = operationPending || count === 0);
            document.getElementById("result-scope").disabled = operationPending;
            document.getElementById("copy-users").textContent = `아이디 복사 (${count}명)`;
            document.getElementById("result-message").textContent = "";
            document.getElementById("copy-fallback").classList.add("hidden");
            document.getElementById("copy-fallback").value = "";
        }
        async function copyUsers() {
            if (operationPending) return;
            const users = selectedUsers();
            if (!users.length) return;
            const text = users.map(user => user.username).join("\n");
            try {
                await navigator.clipboard.writeText(text);
                document.getElementById("result-message").textContent = `${users.length}명의 아이디를 복사했습니다.`;
            } catch (_) {
                const area = document.getElementById("copy-fallback");
                area.value = text; area.classList.remove("hidden"); area.focus(); area.select();
                document.getElementById("result-message").textContent = "자동 복사를 사용할 수 없습니다. 선택된 텍스트를 직접 복사해주세요.";
            }
        }
        function saveUsers(format) {
            if (operationPending) return;
            const users = selectedUsers();
            if (!users.length) return;
            const names = users.map(user => user.username);
            const text = format === "csv" ? "\ufeffusername\r\n" + names.map(name => '"' + name.replaceAll('"', '""') + '"').join("\r\n") + "\r\n"
                : names.join("\n") + "\n";
            const blob = new Blob([text], {type: format === "csv" ? "text/csv;charset=utf-8" : "text/plain;charset=utf-8"});
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            const now = new Date();
            const date = [now.getFullYear(), String(now.getMonth()+1).padStart(2,"0"), String(now.getDate()).padStart(2,"0")].join("-");
            link.href = url; link.download = `instagram-non-followers-${document.getElementById("result-scope").value}-${date}.${format}`;
            link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
            document.getElementById("result-message").textContent = `${users.length}명의 아이디를 ${format.toUpperCase()}로 저장했습니다.`;
        }
        function filterList() {
            const query = document.getElementById("search-input").value.trim().toLowerCase().replace(/^@/, "");
            document.querySelectorAll("#list-user-list .user-item").forEach(row => {
                row.classList.toggle("hidden", !row.dataset.username.toLowerCase().includes(query));
            });
            document.getElementById("filtered-count").textContent = `검색 결과 ${filteredUsers().length}명 / 전체 ${fetchedUsers.length}명`;
            updateResultActions();
        }
        async function doFetch() {
            if (operationPending) return;
            setPending(true);
            showView(listView);
            hideError("list-error");
            document.getElementById("list-result").classList.add("hidden");
            document.getElementById("list-toolbar").classList.add("hidden");
            document.getElementById("list-progress").classList.remove("hidden");
            document.getElementById("search-input").value = "";
            document.getElementById("result-actions").classList.add("hidden");
            document.getElementById("result-scope").value = "filtered";
            fetchedUsers = [];
            document.getElementById("list-user-list").replaceChildren();
            try {
                const data = await api("/api/fetch", {method: "POST"});
                if (data.status === "ok") {
                    fetchedUsers = data.users;
                    renderUserList(fetchedUsers);
                    document.getElementById("list-result-count").textContent = "맞팔이 아닌 유저: " + data.count + "명";
                    document.getElementById("list-snapshot-info").textContent = savedText(data);
                    renderValidation("list-validation", data);
                    document.getElementById("list-result").classList.remove("hidden");
                    document.getElementById("list-toolbar").classList.remove("hidden");
                    document.getElementById("result-actions").classList.remove("hidden");
                } else if (data.status === "login_required") {
                    showView(loginView);
                    showError("login-error", data.message);
                } else { showFailure("list-error", data); }
            } catch (_) { showError("list-error", "JSON 비교 결과를 가져오지 못했습니다."); }
            finally {
                document.getElementById("list-progress").classList.add("hidden");
                setPending(false);
            }
        }
        async function doRefresh() {
            if (operationPending) return;
            setPending(true);
            hideError("fetch-error");
            document.getElementById("export-info").textContent = "내보내기 처리 중... 완료 전까지 기다려주세요.";
            try {
                const data = await api("/api/export/refresh", {method: "POST"});
                if (data.status === "login_required") {
                    showView(loginView);
                    showError("login-error", data.message);
                } else if (["error", "busy"].includes(data.status)) {
                    showFailure("fetch-error", data);
                }
                await updateStatus();
            } catch (_) {
                showError("fetch-error", "처리 결과를 확인하지 못했습니다. 중복 요청을 막기 위해 자동 재시도하지 않습니다.");
            } finally { setPending(false); }
        }
        document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter" && !document.getElementById("login-btn").disabled) doLogin(); });
        document.getElementById("twofa-code").addEventListener("keydown", e => { if (e.key === "Enter" && !document.getElementById("twofa-btn").disabled) doVerify(); });
        const dropZone = document.getElementById("drop-zone");
        dropZone.addEventListener("dragover", event => { event.preventDefault(); dropZone.classList.add("dragging"); });
        dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragging"));
        dropZone.addEventListener("drop", event => { event.preventDefault(); dropZone.classList.remove("dragging"); doImport(event.dataTransfer.files); });
        updateStatus().then(() => showView(loggedinView))
            .catch(() => showError("fetch-error", "앱 서버에 연결하지 못했습니다."));
    </script>
</body>
</html>
