<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram 비팔로워 차단기</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            transition: max-width 0.2s;
        }
        .container.expanded {
            max-width: 500px;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 24px;
            color: #262626;
        }
        .form-group {
            margin-bottom: 16px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #dbdbdb;
            border-radius: 6px;
            font-size: 14px;
            background: #fafafa;
        }
        input:focus {
            outline: none;
            border-color: #a8a8a8;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0095f6;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover {
            background: #1877f2;
        }
        button:disabled {
            background: #b2dffc;
            cursor: not-allowed;
        }
        button.logout-btn {
            background: #ed4956;
        }
        button.logout-btn:hover {
            background: #c13543;
        }
        .error {
            color: #ed4956;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
        }
        .success {
            text-align: center;
            color: #262626;
        }
        .success .username {
            font-size: 20px;
            font-weight: 600;
            margin: 16px 0;
        }
        .success .check {
            font-size: 48px;
            color: #0095f6;
            margin-bottom: 8px;
        }
        .hidden {
            display: none;
        }
        .info {
            font-size: 13px;
            color: #8e8e8e;
            text-align: center;
            margin-top: 12px;
        }
        button.fetch-btn {
            background: #00376b;
            margin-bottom: 8px;
        }
        button.fetch-btn:hover {
            background: #004a99;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .result-header {
            font-size: 15px;
            font-weight: 600;
            color: #262626;
            margin: 16px 0 8px;
            text-align: center;
        }
        .user-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #dbdbdb;
            border-radius: 6px;
            margin-top: 8px;
        }
        .user-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #efefef;
        }
        .user-item:last-child {
            border-bottom: none;
        }
        .user-item img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .user-item .user-info {
            overflow: hidden;
        }
        .user-item .user-info .uname {
            font-size: 14px;
            font-weight: 600;
            color: #262626;
        }
        .user-item .user-info .fname {
            font-size: 12px;
            color: #8e8e8e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* List view styles */
        .list-container {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
        }
        .back-btn {
            background: none;
            border: none;
            color: #0095f6;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            margin-bottom: 16px;
            width: auto;
        }
        .back-btn:hover {
            background: none;
            color: #1877f2;
        }
        .progress-area {
            text-align: center;
            padding: 24px 0;
        }
        .progress-area .spinner-lg {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #0095f6;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        .progress-text {
            font-size: 15px;
            color: #262626;
            font-weight: 500;
        }
        .list-view .user-list {
            max-height: none;
            overflow-y: visible;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Instagram 비팔로워 차단기</h1>

        <!-- Login State -->
        <div id="login-view">
            <div class="form-group">
                <input type="text" id="username" placeholder="사용자 이름" autocomplete="username">
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password">
            </div>
            <button id="login-btn" onclick="doLogin()">로그인</button>
            <div id="login-error" class="error hidden"></div>
        </div>

        <!-- 2FA State -->
        <div id="twofa-view" class="hidden">
            <p class="info" style="margin-bottom: 16px;">Instagram 앱에서 로그인 요청을 승인해주세요.</p>
            <p class="info" style="margin-bottom: 16px; color: #262626;">앱에서 승인 완료 후 아래 버튼을 눌러주세요.</p>
            <button id="twofa-retry-btn" onclick="doRetryLogin()">승인 완료, 다시 시도</button>
            <hr style="margin: 20px 0; border: none; border-top: 1px solid #dbdbdb;">
            <p class="info" style="margin-bottom: 12px;">또는 인증 코드가 있다면 직접 입력:</p>
            <div class="form-group">
                <input type="text" id="twofa-code" placeholder="6자리 인증 코드 (선택)" maxlength="8" autocomplete="one-time-code">
            </div>
            <button id="twofa-btn" onclick="doVerify()" style="background: #8e8e8e;">코드로 인증</button>
            <div id="twofa-error" class="error hidden"></div>
        </div>

        <!-- Logged In State -->
        <div id="loggedin-view" class="hidden">
            <div class="success">
                <div class="check">&#10003;</div>
                <p>로그인 완료!</p>
                <p class="username" id="display-username"></p>
            </div>
            <div id="fetch-loading" class="info" style="margin: 16px 0;">
                <span class="spinner" style="border-color: #8e8e8e; border-top-color: transparent;"></span>
                비팔로워 조회 중...
            </div>
            <div id="fetch-error" class="error hidden"></div>
            <div id="fetch-result" class="hidden">
                <p class="result-header" id="result-count"></p>
                <div class="user-list" id="user-list"></div>
            </div>
            <button id="fetch-btn" class="fetch-btn" onclick="doFetch()">맞팔 안한 목록</button>
            <button class="logout-btn" onclick="doLogout()">로그아웃</button>
        </div>

        <!-- List View -->
        <div id="list-view" class="hidden list-view">
            <button class="back-btn" onclick="goBack()">&larr; 돌아가기</button>
            <div id="list-progress" class="progress-area">
                <div class="spinner-lg"></div>
                <p class="progress-text" id="progress-text">조회 준비 중...</p>
            </div>
            <div id="list-error" class="error hidden"></div>
            <div id="list-result" class="hidden">
                <p class="result-header" id="list-result-count"></p>
                <div class="user-list" id="list-user-list"></div>
            </div>
        </div>
    </div>

    <script>
        const loginView = document.getElementById("login-view");
        const twofaView = document.getElementById("twofa-view");
        const loggedinView = document.getElementById("loggedin-view");
        const listView = document.getElementById("list-view");

        let progressInterval = null;

        // Check status on load
        async function checkStatus() {
            try {
                const res = await fetch("/api/status");
                const data = await res.json();
                if (data.logged_in) {
                    showLoggedIn(data.username);
                }
            } catch (e) {
                console.error("Status check failed:", e);
            }
        }

        function showView(view) {
            loginView.classList.add("hidden");
            twofaView.classList.add("hidden");
            loggedinView.classList.add("hidden");
            listView.classList.add("hidden");
            view.classList.remove("hidden");
            // Expand container for list view
            const container = document.querySelector(".container");
            if (view === listView) {
                container.classList.add("expanded");
            } else {
                container.classList.remove("expanded");
            }
        }

        function showLoggedIn(username) {
            document.getElementById("display-username").textContent = "@" + username;
            document.getElementById("fetch-loading").classList.add("hidden");
            document.getElementById("fetch-result").classList.add("hidden");
            document.getElementById("fetch-btn").classList.remove("hidden");
            hideError("fetch-error");
            showView(loggedinView);
        }

        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.classList.remove("hidden");
        }

        function hideError(elementId) {
            document.getElementById(elementId).classList.add("hidden");
        }

        async function doLogin() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            if (!username || !password) return;

            const btn = document.getElementById("login-btn");
            btn.disabled = true;
            btn.textContent = "로그인 중...";
            hideError("login-error");

            try {
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({username, password}),
                });
                const data = await res.json();

                if (data.status === "ok") {
                    showLoggedIn(username);
                } else if (data.status === "2fa_required") {
                    showView(twofaView);
                } else if (data.status === "challenge_required") {
                    showError("login-error", data.message);
                } else if (data.status === "error") {
                    showError("login-error", data.message);
                }
            } catch (e) {
                showError("login-error", "네트워크 오류가 발생했습니다.");
            } finally {
                btn.disabled = false;
                btn.textContent = "로그인";
            }
        }

        async function doRetryLogin() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const btn = document.getElementById("twofa-retry-btn");
            btn.disabled = true;
            btn.textContent = "확인 중...";
            hideError("twofa-error");

            try {
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({username, password}),
                });
                const data = await res.json();

                if (data.status === "ok") {
                    showLoggedIn(username);
                } else if (data.status === "2fa_required") {
                    showError("twofa-error", "아직 승인되지 않았습니다. 앱에서 승인 후 다시 시도하세요.");
                } else {
                    showError("twofa-error", data.message || "로그인 실패");
                }
            } catch (e) {
                showError("twofa-error", "네트워크 오류가 발생했습니다.");
            } finally {
                btn.disabled = false;
                btn.textContent = "승인 완료, 다시 시도";
            }
        }

        async function doVerify() {
            const code = document.getElementById("twofa-code").value.trim();
            if (!code) return;

            const btn = document.getElementById("twofa-btn");
            btn.disabled = true;
            btn.textContent = "확인 중...";
            hideError("twofa-error");

            try {
                const res = await fetch("/api/verify", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({code}),
                });
                const data = await res.json();

                if (data.status === "ok") {
                    const username = document.getElementById("username").value.trim();
                    showLoggedIn(username);
                } else if (data.status === "error") {
                    showError("twofa-error", data.message);
                } else if (data.status === "challenge_required") {
                    showError("twofa-error", data.message);
                }
            } catch (e) {
                showError("twofa-error", "네트워크 오류가 발생했습니다.");
            } finally {
                btn.disabled = false;
                btn.textContent = "확인";
            }
        }

        async function doLogout() {
            try {
                await fetch("/api/logout", {method: "POST"});
                showView(loginView);
                document.getElementById("username").value = "";
                document.getElementById("password").value = "";
            } catch (e) {
                console.error("Logout failed:", e);
            }
        }

        function goBack() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
            showView(loggedinView);
        }

        async function pollProgress() {
            try {
                const res = await fetch("/api/progress");
                const data = await res.json();
                const textEl = document.getElementById("progress-text");
                if (data.phase === "following") {
                    const total = data.total ? data.total.toLocaleString() : "?";
                    textEl.textContent = `팔로잉 조회 중: ${data.fetched.toLocaleString()} / ${total}명`;
                } else if (data.phase === "followers") {
                    const total = data.total ? data.total.toLocaleString() : "?";
                    textEl.textContent = `팔로워 조회 중: ${data.fetched.toLocaleString()} / ${total}명`;
                }
            } catch (e) {
                // ignore polling errors
            }
        }

        async function doFetch() {
            // Switch to list view
            showView(listView);
            document.getElementById("list-progress").classList.remove("hidden");
            document.getElementById("list-result").classList.add("hidden");
            hideError("list-error");
            document.getElementById("progress-text").textContent = "조회 준비 중...";

            // Start polling progress
            progressInterval = setInterval(pollProgress, 1000);

            try {
                const res = await fetch("/api/fetch", {method: "POST"});
                const data = await res.json();

                // Stop polling
                clearInterval(progressInterval);
                progressInterval = null;

                if (data.status === "ok") {
                    document.getElementById("list-progress").classList.add("hidden");
                    document.getElementById("list-result-count").textContent =
                        "맞팔이 아닌 유저: " + data.count + "명";
                    const userList = document.getElementById("list-user-list");
                    userList.textContent = "";
                    data.users.forEach(function(u) {
                        const div = document.createElement("div");
                        div.className = "user-item";

                        const img = document.createElement("img");
                        img.src = u.profile_pic_url;
                        img.alt = "";
                        img.referrerPolicy = "no-referrer";
                        div.appendChild(img);

                        const info = document.createElement("div");
                        info.className = "user-info";

                        const uname = document.createElement("div");
                        uname.className = "uname";
                        uname.textContent = "@" + u.username;
                        info.appendChild(uname);

                        const fname = document.createElement("div");
                        fname.className = "fname";
                        fname.textContent = u.full_name || "";
                        info.appendChild(fname);

                        div.appendChild(info);
                        userList.appendChild(div);
                    });
                    document.getElementById("list-result").classList.remove("hidden");
                } else if (data.status === "login_required") {
                    showView(loginView);
                    showError("login-error", data.message);
                } else {
                    document.getElementById("list-progress").classList.add("hidden");
                    showError("list-error", data.message || "조회 실패");
                }
            } catch (e) {
                clearInterval(progressInterval);
                progressInterval = null;
                document.getElementById("list-progress").classList.add("hidden");
                showError("list-error", "네트워크 오류가 발생했습니다.");
            }
        }

        // Enter key handlers
        document.getElementById("password").addEventListener("keydown", (e) => {
            if (e.key === "Enter") doLogin();
        });
        document.getElementById("twofa-code").addEventListener("keydown", (e) => {
            if (e.key === "Enter") doVerify();
        });

        checkStatus();
    </script>
</body>
</html>
